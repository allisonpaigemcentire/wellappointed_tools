[project]
name = "slopcheck"
version = "0.1.0"
description = "Flag AI-writing patterns and AI jargon, and suggest a plain-language fix."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Allison McEntire" }]
keywords = ["writing", "prose", "linter", "jargon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
suggest = ["wordfreq>=3.1"]
dev = ["pytest>=8", "wordfreq>=3.1"]

[project.scripts]
slopcheck = "slopcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slopcheck = ["data/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
