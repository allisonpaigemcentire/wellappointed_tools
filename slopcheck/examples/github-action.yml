# Sample check for a repository that has this package at ./slopcheck,
# as in https://github.com/allisonpaigemcentire/wellappointed_tools .
# Do not use `pip install slopcheck`. That PyPI name is a different project.
# Outside this repository, install from git:
#   pip install "slopcheck @ git+https://github.com/allisonpaigemcentire/wellappointed_tools#subdirectory=slopcheck"
name: prose

on:
  pull_request:

jobs:
  slopcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install slopcheck
        run: pip install ./slopcheck
      - name: Check prose
        run: slopcheck --fail-on error docs/
