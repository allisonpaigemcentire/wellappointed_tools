name: slopcheck

on:
  push:
    paths:
      - "slopcheck/**"
      - ".github/workflows/slopcheck-ci.yml"
  pull_request:
    paths:
      - "slopcheck/**"
      - ".github/workflows/slopcheck-ci.yml"

defaults:
  run:
    working-directory: slopcheck

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
