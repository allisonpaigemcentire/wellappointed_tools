[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdebug"
version = "0.1.0"
description = "A small toolkit for finding bugs in agentic and multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentdebug = "agentdebug.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentdebug = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# The fixtures are deliberate smells: undefined names and bare excepts.
extend-exclude = ["tests/fixtures"]
